name: Publish

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: write

jobs:
  ci:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Install dependencies
        run: npm ci

      - name: Lint YAMLs
        run: npx messagevisor lint

      - name: Test specs
        run: npx messagevisor test

      - name: Build
        run: npx messagevisor build

      - name: Git configs
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Upload to Cloudflare Pages
        run: |
          echo "<html><body>It works.</body></html>" > datafiles/index.html
          npx wrangler pages deploy datafiles --project-name="messagevisor-example-cloudflare-pages"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Push back to origin
        run: |
          git add .messagevisor/
          if git diff --cached --quiet; then
            echo "No state file changes to commit"
          else
            git commit -m "[skip ci] Revision $(cat .messagevisor/REVISION)"
            git push
          fi
